{{- if .Values.ingress.enabled }}
{{- $clusterDomain := "" }}
{{- $cluster := lookup "management.cattle.io/v3" "Cluster" "" "local" }}
{{- if $cluster }}
{{- $clusterDomain = index $cluster.metadata.labels "domain" | default "" }}
{{- end }}
{{- if not $clusterDomain }}
{{- $clusterDomain = "local.stevemander.uk" }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "prisoner-problem.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prisoner-problem.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: "prisvis.{{ $clusterDomain }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "prisoner-problem.fullname" . }}-service
                port:
                  number: {{ .Values.service.port }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - "prisvis.{{ $clusterDomain }}"
      secretName: {{ include "prisoner-problem.fullname" . }}-tls
  {{- end }}
{{- end }}
